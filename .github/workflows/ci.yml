name: CI

on:
    push:
        branches: [ main, master ]
    pull_request:
        branches: [ main, master ]

jobs:
    lint-and-test:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: Setup Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: Setup uv
              uses: astral-sh/setup-uv@v4

            - name: Install Node dependencies
              run: npm ci

            - name: Install Python dependencies
              run: uv sync --frozen

            - name: Lint TypeScript
              run: npm run lint

            - name: Type-check TypeScript
              run: npm run check-types

            - name: Lint Python
              run: |
                  uv run ruff check .
                  uv run ruff format --check .

            - name: Validate extension data
              run: uv run pytest -q

            - name: Run TypeScript unit tests
              run: npm run test:unit

            - name: Verify generated catalog is current
              run: |
                  npm run build-data
                  git diff --exit-code -- htmx.catalog.json

            - name: Verify HTMX pins are current
              run: uv run python scripts/check-htmx-pins.py
              env:
                  GITHUB_TOKEN: ${{ github.token }}

            - name: Run VS Code extension-host tests
              run: xvfb-run -a npm run test:extension

            - name: Package and inspect VSIX
              run: |
                  npm run package
                  npx vsce ls --tree
