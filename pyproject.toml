[project]
name = "htmx-tags-tools"
version = "0.1.1"
description = "Developer tooling for HTMX Tags for Django"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["packaging>=24", "pydantic>=2", "httpx2", "cyclopts>=3"]

[project.scripts]
htmx-tools = "htmx_tools.cli:app"

[dependency-groups]
dev = ["prek>=0.3.8", "pytest>=8.3.0", "ruff>=0.15.0", "ty>=0.0.1a10"]
docs = ["zensical>=0.0.36"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["htmx_tools"]
